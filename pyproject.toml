[project]
name = "echoprofile"
version = "0.1.0"
description = "Spin up ephemeral, isolated Edge browser sessions cloned from one persistent logged-in profile."
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.45",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.scripts]
echoprofile = "echoprofile.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["echoprofile"]
