<!doctype html>
<html><head><meta charset="utf-8"><title>EchoProfile Browser Control</title><style>body{font:14px system-ui;max-width:560px;margin:40px auto;padding:0 20px}label{display:block;margin:16px 0 6px}input{box-sizing:border-box;width:100%;padding:9px}button{margin-top:18px;padding:9px 14px}#status{margin-left:10px}</style></head>
<body><h1>EchoProfile Browser Control</h1><p>Connect this browser profile to your local EchoProfile server.</p>
<label for="server">Server URL</label><input id="server" value="http://127.0.0.1:8756">
<label for="token">Pairing token</label><input id="token" type="password" autocomplete="off">
<button id="save">Save and connect</button><span id="status"></span><script src="options.js"></script></body></html>
